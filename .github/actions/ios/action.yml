name: "iOS Workflow"

inputs:
  VERSION_NAME:
    description: 'Version Name to be used for build'
    required: false
    default: '1.0.0'
  VERSION_CODE:
    description: 'Version Code to be used for build'
    required: true
    default: '1'

runs:
  using: "composite"
  steps:
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        cache: true
        flutter-version-file: pubspec.yaml

    - name: Cache CocoaPods
      uses: actions/cache@v6
      with:
        path: |
          ios/Pods
          ~/Library/Caches/CocoaPods
          ~/.cocoapods
        key: ${{ runner.os }}-cocoapods-${{ hashFiles('ios/Podfile', 'pubspec.lock') }}

    - name: Cache Rust
      uses: ./.github/actions/rust-cache
      
    - name: Update Podfile
      shell: bash
      run: |
        cd ./ios
        flutter pub get
        pod install

    - name: Build iOS IPA (No Code Signing for PRs)
      if: ${{ github.event_name == 'pull_request' }}
      shell: bash
      env:
        VERSION_NAME: ${{ inputs.VERSION_NAME }}
        VERSION_CODE: ${{ inputs.VERSION_CODE }}
      run: |
        flutter build ipa --no-codesign --build-name $VERSION_NAME --build-number $VERSION_CODE

    - name: Build iOS IPA (With Code Signing)
      if: ${{ github.event_name == 'push' }}
      shell: bash
      env:
        VERSION_NAME: ${{ inputs.VERSION_NAME }}
        VERSION_CODE: ${{ inputs.VERSION_CODE }}
      run: |
        flutter build ipa --build-name $VERSION_NAME --build-number $VERSION_CODE
