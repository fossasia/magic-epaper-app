name: "Rust Build Cache"

runs:
  using: "composite"
  steps:
    - name: Cache Rust dependencies and toolchains
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.rustup/toolchains
          ~/.rustup/update
        key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-rust-
