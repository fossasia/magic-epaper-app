name: Comment

on:
  workflow_run:
    workflows: [ Magic Epaper PR CI ]
    types:
      - completed

jobs:
  comment:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Download artifacts
        id: download-artifacts
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const { data: { artifacts } } = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: ${{ github.event.workflow_run.id }},
            });

            async function downloadIfAvailable(name, dest) {
              const artifact = artifacts.find(a => a.name === name);
              if (!artifact) return;
              const download = await github.rest.actions.downloadArtifact({
                owner,
                repo,
                artifact_id: artifact.id,
                archive_format: 'zip',
              });
              fs.writeFileSync(`${{ github.workspace }}/${dest}`, Buffer.from(download.data));
            }

            await downloadIfAvailable('pr', 'pr.zip');
            await downloadIfAvailable('Android Screenshots', 'androidScreenshots.zip');
            await downloadIfAvailable('iPad Screenshots', 'iPadScreenshots.zip');
            await downloadIfAvailable('iPhone Screenshots', 'iPhoneScreenshots.zip');

      - name: Unzip Artifacts
        shell: bash
        run: |
          if [ -f "pr.zip" ]; then unzip pr.zip; fi
          mkdir -p screenshots
          if [ -f "androidScreenshots.zip" ]; then unzip androidScreenshots.zip -d screenshots/; fi
          if [ -f "iPadScreenshots.zip" ]; then unzip iPadScreenshots.zip -d screenshots/; fi
          if [ -f "iPhoneScreenshots.zip" ]; then unzip iPhoneScreenshots.zip -d screenshots/; fi

      - name: Fetch PR Number
        id: fetch-pr-number
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let issue_number;
            if (fs.existsSync('./NR')) {
              issue_number = Number(fs.readFileSync('./NR'));
            } else {
              const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.payload.workflow_run.head_sha,
              });
              if (data.length > 0) {
                issue_number = data[0].number;
              } else {
                core.setFailed('Could not determine PR number from commit SHA.');
              }
            }
            if (!issue_number) core.setFailed('Could not determine PR number');
            core.setOutput('pr_number', issue_number);

      - name: Update PR Screenshots
        shell: bash
        run: |
          if [ -z "$(ls -A screenshots/ 2>/dev/null)" ]; then
            echo "No screenshots found, skipping."
            exit 0
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git clone --branch=pr-screenshots --depth=1 https://${{ github.repository_owner }}:${{ github.token }}@github.com/${{ github.repository }} pr-screenshots; then
            git init pr-screenshots
            cd pr-screenshots
            git remote add origin https://${{ github.repository_owner }}:${{ github.token }}@github.com/${{ github.repository }}
          else
            cd pr-screenshots
          fi

          for file in ../screenshots/*; do
            if [[ -f "$file" ]]; then
              filename=$(basename "$file")

              if [[ "$filename" =~ -([0-9]+_.*\.png)$ ]]; then
                screenshot_part="${BASH_REMATCH[1]}"

                if [[ "$filename" == *"iPhone"* ]]; then
                  generic_name="iPhone-${screenshot_part}"
                elif [[ "$filename" == *"iPad"* ]]; then
                  generic_name="iPad-${screenshot_part}"
                else
                  generic_name="Android-${screenshot_part}"
                fi
              else
                generic_name="$filename"
              fi

              cp -f "$file" "./${{ steps.fetch-pr-number.outputs.pr_number }}_${generic_name}"
            fi
          done

          git checkout --orphan temporary
          git add --all .
          git commit -am "[Auto] Update screenshots for #${{ steps.fetch-pr-number.outputs.pr_number }} ($(date +%Y-%m-%d.%H:%M:%S))"
          git branch -D pr-screenshots || true
          git branch -m pr-screenshots
          git push --force origin pr-screenshots

      - name: Update PR Comment
        uses: actions/github-script@v9
        with:
          script: |
            const issue_number = ${{ steps.fetch-pr-number.outputs.pr_number }};
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const conclusion = '${{ github.event.workflow_run.conclusion }}';
            const run_id = ${{ github.event.workflow_run.id }};

            const { data: artifactsData } = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id,
            });
            const artifacts = artifactsData.artifacts;

            const ignoredArtifacts = ['pr', 'Android Screenshots', 'iPad Screenshots', 'iPhone Screenshots'];

            let artifactLinks = '';
            artifacts.forEach(artifact => {
              if (!ignoredArtifacts.includes(artifact.name)) {
                const url = `https://github.com/${owner}/${repo}/actions/runs/${run_id}/artifacts/${artifact.id}`;
                let platformName = artifact.name;
                if (artifact.name.includes('apk-files')) platformName = 'Android';
                else if (artifact.name.includes('iOS IPA')) platformName = 'iOS';
                else if (artifact.name.includes('windows-installer')) platformName = 'Windows';
                else if (artifact.name.includes('macos-app')) platformName = 'macOS';
                else if (artifact.name === 'linux-packages') platformName = 'Linux';
                else if (artifact.name === 'linux-packages-arm64') platformName = 'Linux (ARM64)';
                else if (artifact.name.includes('web-app') || artifact.name.includes('web')) platformName = 'Web';
                artifactLinks += `- **${platformName}**: [Download](${url})\n`;
              }
            });

            const screenshotSections = (platform, label) => {
              const n = issue_number;
              const base = `https://github.com/${owner}/${repo}/blob/pr-screenshots`;
              const screens = [
                ['display_selection', '1'],
                ['sidebar', '2'],
                ['ndef_screen', '3'],
                ['filter_selection', '4'],
                ['barcode_screen', '5'],
                ['Barcode_added', '6'],
                ['Templates_screen', '7'],
              ];
              const cells = screens.map(([name, idx]) =>
                `<td><img src="${base}/${n}_${platform}-${idx}_${name}.png?raw=true" width="200"/></td>`
              ).join('\n              ');
              return `
            <details>
            <summary>${label} Screenshots</summary>
            <table>
              <tr>
                ${cells}
              </tr>
            </table>
            </details>`;
            };

            const artifactNames = artifacts.map(a => a.name);
            const hasAndroid = artifactNames.includes('Android Screenshots');
            const hasIPhone = artifactNames.includes('iPhone Screenshots');
            const hasIPad = artifactNames.includes('iPad Screenshots');

            const screenshotsSection = `
            ## Screenshots

            ${hasAndroid ? screenshotSections('Android', 'Android') : ''}
            ${hasIPhone ? screenshotSections('iPhone', 'iPhone') : ''}
            ${hasIPad ? screenshotSections('iPad', 'iPad') : ''}`;

            let body = `**Build Status:** `;
            if (conclusion === 'success') {
              body += `Build successful.\n\n## Build artifacts to test\n\n${artifactLinks || '_No artifacts uploaded._'}\n\n${screenshotsSection}`;
            } else {
              body += `Build workflow failed. _Please check the [Actions logs](https://github.com/${owner}/${repo}/actions/runs/${run_id}) for details._\n`;
              if (artifactLinks) {
                body += `\n## Build artifacts to test\n\n(Available before failure)\n\n${artifactLinks}\n`;
              }
              body += `\n> *Note: Screenshots are not generated on failed builds. Below are the latest screenshots from the \`pr-screenshots\` branch, if they exist.*\n\n${screenshotsSection}`;
            }

            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.user.login === 'github-actions[bot]');

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
